name: Startplatz-Monitor 214 km

on:
  schedule:
    - cron: "*/5 * * * *"      # kürzestes Intervall bei GitHub; Läufe können sich verspäten
  workflow_dispatch:            # manuell startbar über "Run workflow"

permissions:
  contents: write               # zum Zurückschreiben von state.json

concurrency:
  group: startplatz-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q -r requirements.txt

      - name: Freie Plätze prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Status speichern (nur bei Änderung)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(cat state.json | tr -d '\n ' ) [skip ci]"
            git push
          fi
